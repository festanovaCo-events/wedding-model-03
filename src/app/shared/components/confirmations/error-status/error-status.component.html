<div class="flex flex-col items-center justify-center gap-4 px-4 w-full">
    <div class="flex items-center justify-center w-20 h-20 md:w-24 md:h-24 rounded-full bg-primary/10 mb-2">
        <hugeicons-icon class="text-primary" [icon]="Alert02Icon" [size]="40" color="currentColor" [strokeWidth]="1.75" />
    </div>
    <h2 class="text-heading font-bold text-xl md:text-2xl lg:text-3xl text-center font-cookie">
        Oops, algo salió mal
    </h2>
    <p class="text-theme-text text-sm md:text-base lg:text-lg text-center max-w-md">
        No pudimos cargar tu información de invitación en este momento.
    </p>
    <p class="text-primary-soft text-xs md:text-sm text-center max-w-md mt-2">
        Por favor, intenta recargar la página o contacta con el organizador del evento.
    </p>
</div>
