<section class="px-6 py-16 text-center bg-surface">
  <img [src]="info.decoration" alt="" class="mx-auto mb-8 h-3 w-40 object-cover" />
  <p class="text-sm tracking-[0.2em] uppercase text-muted">{{ info.hero.date }}</p>
  <h1 class="mt-3 font-cookie text-5xl text-heading md:text-6xl">{{ info.hero.title }}</h1>
  <p class="mx-auto mt-6 max-w-md whitespace-pre-line text-theme-text">{{ info.hero.quote }}</p>
</section>
