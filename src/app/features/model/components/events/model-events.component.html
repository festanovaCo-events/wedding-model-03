<section class="grid gap-6 bg-surface-alt px-6 py-12 md:grid-cols-2">
  <article class="rounded-2xl border border-theme-border bg-surface p-6">
    <h2 class="font-cookie text-3xl text-heading">{{ ceremony.title }}</h2>
    <p class="mt-3 text-theme-text">{{ ceremony.date }}</p>
    <p class="mt-1 font-semibold text-heading">{{ ceremony.place }}</p>
    <p class="text-sm text-muted">{{ ceremony.address }}</p>
    <a class="mt-4 inline-block text-sm font-semibold text-primary" [href]="ceremony.mapsUrl" target="_blank" rel="noopener">
      Ver mapa
    </a>
  </article>
  <article class="rounded-2xl border border-theme-border bg-surface p-6">
    <h2 class="font-cookie text-3xl text-heading">{{ party.title }}</h2>
    <p class="mt-3 text-theme-text">{{ party.date }}</p>
    <p class="mt-1 font-semibold text-heading">{{ party.place }}</p>
    <p class="text-sm text-muted">{{ party.address }}</p>
    <a class="mt-4 inline-block text-sm font-semibold text-primary" [href]="party.mapsUrl" target="_blank" rel="noopener">
      Ver mapa
    </a>
  </article>
</section>
